[project]
name = "fastapi-service"
version = "0.1.0"
description = "FastAPI service for essay judging"
authors = [{name = "High Horse Society"}]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-ai",
    "openai",
    "httpx"
]
requires-python = ">=3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "requests"
]

[project.scripts]
start = "fastapi_service.main:start"